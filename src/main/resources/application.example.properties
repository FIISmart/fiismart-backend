# Local-dev template. Copy to src/main/resources/application.properties (gitignored).
# Real values come from env vars in production.

server.port=8082

spring.application.name=FIISmart-Monolith

spring.data.mongodb.uri=${MONGO_URI:}
spring.data.mongodb.database=${MONGO_DATABASE:FIISmart}

# Enable only in local/dev when you want demo tutors and published demo courses.
fiismart.seed.demo-data.enabled=false

logging.level.org.springframework.data.mongodb=WARN
logging.level.ro.fiismart=INFO

spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

aws.cognito.region=${AWS_COGNITO_REGION:}
aws.cognito.user-pool-id=${AWS_COGNITO_USER_POOL_ID:}
aws.cognito.client-id=${AWS_COGNITO_CLIENT_ID:}
aws.cognito.hosted-ui-domain=${AWS_COGNITO_DOMAIN:}
aws.cognito.redirect-uri=${AWS_COGNITO_REDIRECT_URI:http://localhost:3000/auth/callback}

aws.region=${AWS_DEFAULT_REGION:eu-north-1}
aws.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
aws.s3.bucket-name=${AWS_S3_BUCKET:fiismart-content-bucket}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,http://localhost:3000}

# Gemini AI — see docs/AI_SETUP.md
gemini.api.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
gemini.api.model=${GEMINI_MODEL:gemini-2.5-flash-lite}
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.timeout-seconds=${GEMINI_TIMEOUT_SECS:60}

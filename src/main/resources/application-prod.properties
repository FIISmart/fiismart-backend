# Production profile — loaded when SPRING_PROFILES_ACTIVE=prod.
# Every value must come from an env var (no inline secrets here — this file
# IS committed to git).

# Railway/Cloud Run/etc inject PORT; bind it.
server.port=${PORT:8080}

spring.application.name=FIISmart-Monolith

spring.data.mongodb.uri=${MONGO_URI:}
spring.data.mongodb.database=${MONGO_DATABASE:FIISmart}

logging.level.org.springframework.data.mongodb=WARN
logging.level.ro.fiismart=INFO

spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

aws.cognito.region=${AWS_COGNITO_REGION:}
aws.cognito.user-pool-id=${AWS_COGNITO_USER_POOL_ID:}
aws.cognito.client-id=${AWS_COGNITO_CLIENT_ID:}
aws.cognito.client-secret=${AWS_COGNITO_CLIENT_SECRET:}
aws.cognito.hosted-ui-domain=${AWS_COGNITO_DOMAIN:}
aws.cognito.redirect-uri=${AWS_COGNITO_REDIRECT_URI:}

aws.region=${AWS_DEFAULT_REGION:eu-north-1}
aws.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
aws.s3.bucket-name=${AWS_S3_BUCKET:fiismart-content-bucket}

# CORS: set CORS_ALLOWED_ORIGINS as a comma-separated list on the host.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Gemini AI
gemini.api.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
gemini.api.model=${GEMINI_MODEL:gemini-3.1-flash-lite}
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.timeout-seconds=${GEMINI_TIMEOUT_SECS:60}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Hard-pin the demo seeder OFF in prod. Without this an env-var typo
# (FIISMART_SEED_DEMO_DATA_ENABLED=true) could flip it on. The seeder
# has its own profile/host guard too, but defense in depth.
fiismart.seed.demo-data.enabled=false

services:
  mongo:
    image: mongo:7
    container_name: fiismart-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: FIISmart
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 5

volumes:
  mongo_data:
